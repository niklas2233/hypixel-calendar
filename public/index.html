<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="darkreader-lock">
<title>SkyBlock Event Calendar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27 shape-rendering=%27crispEdges%27><rect x=%271%27 y=%272%27 width=%2714%27 height=%2713%27 fill=%27%23e0e0e0%27/><rect x=%271%27 y=%272%27 width=%2714%27 height=%274%27 fill=%27%23ffaa00%27/><rect x=%274%27 y=%271%27 width=%272%27 height=%273%27 fill=%27%23555%27/><rect x=%2710%27 y=%271%27 width=%272%27 height=%273%27 fill=%27%23555%27/><rect x=%279%27 y=%279%27 width=%274%27 height=%274%27 fill=%27%23ff5555%27/></svg>">
<link rel="stylesheet" href="style.css">

<div class="wrap">
  <header class="panel">
    <h1>SkyBlock Event Calendar</h1>
    <div class="sub">Times shown in your timezone: <b id="tz"></b></div>
    <a class="btn" id="settingsLink" href="settings" hidden>Discord notifications</a>
  </header>

  <div class="main">
    <div class="col">
    <section class="panel">
      <div class="toolbar">
        <button id="prev" aria-label="Previous month">&lt;</button>
        <button id="today">Today</button>
        <button id="next" aria-label="Next month">&gt;</button>
        <h2 id="title"></h2>
      </div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="panel">
      <h2 id="elecTitle">Election</h2>
      <div class="cands" id="cands"></div>
    </section>
    </div>

    <aside class="panel">
      <h2>SkyBlock Clock</h2>
      <div class="sb-date" id="sbdate"></div>
      <div class="sb-time" id="sbtime"></div>
      <h2>Mayor</h2>
      <div id="mayor"></div>
      <h2>Up Next</h2>
      <ul class="up" id="upcoming"></ul>
      <div class="legend" id="legend"></div>
    </aside>
  </div>

  <footer>1 SkyBlock day = 20 real minutes · 1 SkyBlock year = 124 real hours. Not affiliated with Hypixel or Mojang.</footer>
</div>

<script src="skyblock.js"></script>
<script>
const { YEAR, MONTHS, MC, sbDate, ord, resultsAt } = SB;

let hidden = new Set();
try { hidden = new Set(JSON.parse(localStorage.getItem("hiddenEvents") || "[]")); } catch {}
let mayorExtra = []; // events added by the current mayor, e.g. Fishing Festival
const allEvents = () => [...SB.EVENTS, ...mayorExtra];
const occurrences = (from, to) => SB.occurrences(from, to, allEvents().filter(e => !hidden.has(e.id)));
// Clock style follows the viewer's timezone, not their browser language (an English browser in Sweden still gets 24h).
// ponytail: hand-kept list of 12-hour regions; extend it if someone reports a wrong clock.
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
const TWELVE_HOUR = /^(America\/(?!(Sao_Paulo|Argentina|Buenos_Aires|Santiago|Montevideo|Asuncion|Havana|Caracas|La_Paz|Lima|Guayaquil|Cayenne|Paramaribo|Noronha|Recife|Fortaleza|Belem|Manaus|Bahia|Maceio|Araguaina|Cuiaba|Campo_Grande|Porto_Velho|Boa_Vista|Rio_Branco|Santarem|Eirunepe|Punta_Arenas|Godthab|Nuuk|Scoresbysund|Danmarkshavn|Miquelon))|US\/|Canada\/|Australia\/|Pacific\/(Auckland|Chatham|Honolulu|Guam|Saipan|Pago_Pago)|Asia\/(Kolkata|Calcutta|Karachi|Dhaka|Manila|Riyadh|Kuwait|Qatar|Bahrain|Amman|Damascus|Baghdad|Kathmandu|Thimphu|Colombo)|Africa\/(Cairo|Khartoum))/.test(TZ);
const HOUR = { hour: "2-digit", minute: "2-digit", hourCycle: TWELVE_HOUR ? "h12" : "h23" };
const fmtTime = t => new Date(t).toLocaleTimeString([], HOUR);
const fmtFull = t => new Date(t).toLocaleString([], { weekday: "short", month: "short", day: "numeric", ...HOUR });
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
        m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (d) return `${d}d ${h}h ${m}m`;
  if (h) return `${h}h ${m}m`;
  return `${m}m ${String(sec).padStart(2, "0")}s`;
}
// Hypixel-style lore for one event occurrence (Up Next list).
function eventTip(o, now) {
  const sb = sbDate(o.start), live = o.start <= now;
  const lines = [`§8${MONTHS[sb.month]} ${ord(sb.day)}, Year ${o.year}`, "",
    `§7Starts: §f${fmtFull(o.start)}`, `§7Ends: §f${fmtFull(o.end)}`, `§7Duration: §f${fmtDur(o.end - o.start)}`, "",
    live ? `§7Ends in: §e${fmtDur(o.end - now)}` : `§7Starts in: §e${fmtDur(o.start - now)}`, "",
    live ? "§a§lACTIVE NOW" : "§e§lUPCOMING EVENT"];
  return `<div class="l name">${mc(`§${o.mc}${o.name}`)}</div>` + lines.map(l => `<div class="l">${mc(l)}</div>`).join("");
}

let view = new Date(); view.setDate(1);

// Hypixel-style item lore for a day. Busier days get a higher "rarity", like item tiers.
const RARITY = [["§f", "COMMON"], ["§a", "UNCOMMON"], ["§9", "RARE"], ["§5", "EPIC"], ["§6", "LEGENDARY"]];
const tips = {}; // tooltip HTML by data-tip key: "d<i>" for days, "c<i>" for candidates
function dayTip(d0, d1, today) {
  const [rc, rname] = RARITY[Math.min(today.length, RARITY.length - 1)];
  const sb = sbDate(+d0);
  const t = o => o < +d0 || o > +d1 ? fmtFull(o) : fmtTime(o);
  const lines = [`§8${MONTHS[sb.month]} ${ord(sb.day)}, Year ${sb.year}`, ""];
  for (const o of today) {
    lines.push(`§${o.mc}${o.name}`, `§7${t(o.start)} §8→ §7${t(o.end)}`, "");
  }
  if (!today.length) lines.push("§7No events today.", "");
  lines.push(`${rc}§l${rname} DAY`);
  return `<div class="l name">${mc(rc + d0.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" }))}</div>`
    + lines.map(l => `<div class="l">${mc(l)}</div>`).join("");
}

const tipEl = document.createElement("div");
tipEl.id = "tip"; tipEl.hidden = true; document.body.append(tipEl);
function placeTip(x, y) {
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = x + 14, top = y - 14;
  if (left + w > innerWidth - 8) left = Math.max(8, x - 14 - w);
  if (top + h > innerHeight - 8) top = innerHeight - 8 - h;
  tipEl.style.transform = `translate(${left}px, ${Math.max(8, top)}px)`;
}
function showTip(el, x, y) {
  tipEl.dataset.key = el.dataset.tip;
  tipEl.innerHTML = tips[el.dataset.tip]; tipEl.hidden = false; placeTip(x, y);
}
document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  el ? showTip(el, e.clientX, e.clientY) : (tipEl.hidden = true);
});
document.addEventListener("mouseleave", () => tipEl.hidden = true);
document.addEventListener("focusin", e => {
  const el = e.target.closest("[data-tip]"), r = el?.getBoundingClientRect();
  if (el) showTip(el, r.right - 10, r.top + 20);
});
document.addEventListener("focusout", () => tipEl.hidden = true);

function renderMonth() {
  const grid = document.getElementById("grid");
  document.getElementById("title").textContent = view.toLocaleDateString([], { month: "long", year: "numeric" });
  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7)); // weeks start Monday
  const end = new Date(start); end.setDate(start.getDate() + 42);
  const occ = occurrences(+start, +end);
  const todayKey = new Date().toDateString();

  let html = "";
  const dow = new Date(2024, 0, 1); // a Monday
  for (let i = 0; i < 7; i++) { html += `<div class="dow">${dow.toLocaleDateString([], { weekday: "short" })}</div>`; dow.setDate(dow.getDate() + 1); }
  for (let i = 0; i < 42; i++) {
    const d0 = new Date(start); d0.setDate(start.getDate() + i);
    const d1 = new Date(d0); d1.setDate(d0.getDate() + 1);
    const cls = ["day", d0.getMonth() !== view.getMonth() && "other", d0.toDateString() === todayKey && "today"].filter(Boolean).join(" ");
    const today = occ.filter(o => o.end > d0 && o.start < d1);
    const evs = today.map(o => {
      const label = o.start >= +d0 ? fmtTime(o.start) : o.end <= +d1 ? "ends " + fmtTime(o.end) : "all day";
      return `<div class="ev" style="color:${o.color}"><i></i><span>${o.short || o.name}</span> <small>${label}</small></div>`;
    }).join("");
    tips["d" + i] = dayTip(d0, d1, today);
    html += `<div class="${cls}" tabindex="0" data-tip="d${i}"><div class="num">${d0.getDate()}</div><div class="evs">${evs}</div></div>`;
  }
  grid.innerHTML = html;
}

function renderClock() {
  const now = Date.now(), sb = sbDate(now);
  document.getElementById("sbdate").textContent = `${MONTHS[sb.month]} ${ord(sb.day)}`;
  document.getElementById("sbtime").textContent =
    `Year ${sb.year} · ${String(sb.h).padStart(2, "0")}:${String(sb.m - sb.m % 10).padStart(2, "0")}`;
  const up = occurrences(now, now + YEAR).slice(0, 8);
  document.getElementById("upcoming").innerHTML = up.map((o, i) => {
    tips["u" + i] = eventTip(o, now);
    const live = o.start <= now;
    return `<li data-tip="u${i}"><div class="name" style="color:${o.color}"><i></i>${o.name}</div>
      <div class="when">${live ? `<span class="live">LIVE NOW</span>` : fmtFull(o.start)}
      <span class="cd ${live ? "live" : ""}">${live ? "ends in " + fmtDur(o.end - now) : "in " + fmtDur(o.start - now)}</span></div></li>`;
  }).join("");
  const key = tipEl.dataset.key;
  if (!tipEl.hidden && key?.startsWith("u")) tipEl.innerHTML = tips[key]; // keep an open countdown ticking
}

function renderLegend() {
  document.getElementById("legend").innerHTML = "<h2>Show Events</h2>" + allEvents().map(e => {
    const len = e.at[0][2], dur = len * 20 >= 60 ? `${len * 20 / 60}h` : `${len * 20}m`;
    return `<label style="color:${e.color}"><input type="checkbox" id="f-${e.id}" data-id="${e.id}" ${hidden.has(e.id) ? "" : "checked"}>${e.name}<span class="meta">${dur}</span></label>`;
  }).join("");
}

document.getElementById("legend").addEventListener("change", e => {
  const id = e.target.dataset.id;
  e.target.checked ? hidden.delete(id) : hidden.add(id);
  try { localStorage.setItem("hiddenEvents", JSON.stringify([...hidden])); } catch {}
  renderMonth(); renderClock();
});
document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth() - 1); renderMonth(); };
document.getElementById("next").onclick = () => { view.setMonth(view.getMonth() + 1); renderMonth(); };
document.getElementById("today").onclick = () => { view = new Date(); view.setDate(1); renderMonth(); };
document.getElementById("tz").textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;

// Pixel-noise "deepslate" background generated on a tiny canvas.
const c = document.createElement("canvas"); c.width = c.height = 16;
const g = c.getContext("2d");
for (let x = 0; x < 16; x++) for (let y = 0; y < 16; y++) {
  const v = 14 + Math.floor(Math.random() * 12); g.fillStyle = `rgb(${v},${v},${v + 2})`; g.fillRect(x, y, 1, 1);
}
document.body.style.backgroundImage = `url(${c.toDataURL()})`;

// ---- Mayor & election ----
// Snapshot of api.hypixel.net/v2/resources/skyblock/election, used when the live fetch is blocked
// (published artifacts can't reach outside hosts; opening the local file gets live data).
// ponytail: snapshot goes stale when the mayor's term ends; refresh it by republishing.
const SNAPSHOT = {"lastUpdated":1793571772346,"mayor":{"key":"slayer","name":"Aatrox","perks":[{"name":"SLASHED Pricing","description":"Starting slayer quests is §ehalf price§7."},{"name":"Slayer XP Buff","description":"Earn §d25% §7more Slayer XP."},{"name":"Pathfinder","description":"Gain rare drops §d20% §7more often."}],"minister":{"key":"events","name":"Foxy","perk":{"name":"Extra Event","description":"Schedules an extra §bFishing Festival §7event during the year.","minister":true}},"election":{"year":522}},"current":{"year":523,"candidates":[{"key":"dungeons","name":"Paul","perks":[{"name":"Marauder","description":"Dungeon reward chests are §e20% §7cheaper.","minister":false},{"name":"EZPZ","description":"Gain §e10 §7bonus score on dungeon runs.","minister":true}],"votes":264982},{"key":"mining","name":"Cole","perks":[{"name":"Mining Fiesta","description":"§7Gain §3+25☯ Mining Wisdom§7, §6+25%  Mining Fortune§7, and collect §9Refined Minerals §7and §5Glossy Gemstones§7 from mining!","minister":true}],"votes":187892},{"key":"farming","name":"Finnegan","perks":[{"name":"Pest Eradicator","description":"The duration of Pesthunter Phillip's §6 Farming Fortune §7bonus is now §a60m§7. Decreases the spawn cooldown of §2Pests §7by §a20%§7.","minister":true},{"name":"Blooming Business","description":"All Garden Visitors reward §aFine Flour§7 and §c+10% Copper §7for accepting offers. Invites §a5 §7unique visitors to your §aGarden §7and makes higher rarity visitors §a20% §7more likely to show up.","minister":false}],"votes":116244},{"key":"pets","name":"Diana","perks":[{"name":"Sharing is Caring","description":"Unlocks §a2 §7more §6Exp Share §7slots in your pets menu and increases the §6Exp Share §7rate by §a+10%§7!","minister":true}],"votes":17165},{"key":"economist","name":"Diaz","perks":[{"name":"Stock Exchange","description":"Participate in the §dStonks Auction §7for a chance to win §5Stock of Stonks§7! Trade them for §6extravagant items §7at the §bTrade Center§7.","minister":true}],"votes":38873}]}};

// Minecraft § color codes → HTML. Formatting codes (§l, §o…) keep the current color.
const html = s => s.replace(/[&<>"']/g, ch => `&#${ch.charCodeAt(0)};`);
function mc(s) {
  let color = MC[7];
  return s.split("§").map((part, i) => {
    if (i > 0) { color = MC[part[0]?.toLowerCase()] || color; part = part.slice(1); }
    return part && `<span style="color:${color}">${html(part)}</span>`;
  }).join("");
}

function renderElection(data, live) {
  const m = data.mayor, termEnd = resultsAt(m.election.year + 1) + YEAR, now = Date.now();
  mayorExtra = SB.mayorEvents(data);

  const stale = now > termEnd;
  document.getElementById("mayor").innerHTML = `
    <div class="mayor-name">${html(m.name)}</div>
    <div class="term">In office until ${fmtFull(termEnd)}${stale ? "" : ` (in ${fmtDur(termEnd - now)})`}</div>
    <div class="src ${stale ? "warn" : ""}">${live ? "Live from the Hypixel API"
      : stale ? "Snapshot is out of date. Open the local file for live data."
      : `Snapshot from ${fmtFull(data.lastUpdated)}`}</div>
    <ul class="perks">${m.perks.map(p => `<li><b>${html(p.name)}</b><span>${mc(p.description)}</span></li>`).join("")}
    ${m.minister ? `<li><b class="minister">Minister ${html(m.minister.name)}: ${html(m.minister.perk.name)}</b><span>${mc(m.minister.perk.description)}</span></li>` : ""}</ul>`;

  const c = data.current;
  const title = document.getElementById("elecTitle"), cands = document.getElementById("cands");
  if (!c) {
    title.textContent = "Election";
    cands.innerHTML = `<div class="sub">The election booth is closed. Next election opens Late Summer 27th.</div>`;
    return;
  }
  const total = c.candidates.reduce((s, x) => s + (x.votes || 0), 0) || 1;
  const sorted = [...c.candidates].sort((a, b) => (b.votes || 0) - (a.votes || 0));
  title.textContent = `Year ${c.year} Election · results ${fmtFull(resultsAt(c.year + 1))}`;
  cands.innerHTML = sorted.map((x, i) => {
    const pct = (x.votes || 0) / total * 100;
    const lines = [`§8Year ${c.year} Candidate`, "",
      `§7Votes: §e${(x.votes || 0).toLocaleString()} §8(${pct.toFixed(1)}%)`, `§7Rank: §f#${i + 1}`, ""];
    for (const p of x.perks) lines.push(`§a${p.name}${p.minister ? " §b(Minister perk)" : ""}`, "§7" + p.description, "");
    lines.push(i === 0 ? "§6§lLEADING CANDIDATE" : "§7§lCANDIDATE");
    tips["c" + i] = `<div class="l name">${mc((i === 0 ? "§6" : "§e") + "Mayor " + x.name)}</div>`
      + lines.map(l => `<div class="l">${mc(l)}</div>`).join("");
    return `<div class="cand ${i === 0 ? "lead" : ""}">
      <span class="who" tabindex="0" data-tip="c${i}">${i === 0 ? "★ " : ""}${html(x.name)}</span>
      <span class="votes">${(x.votes || 0).toLocaleString()} · ${pct.toFixed(1)}%</span>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="cperks">${x.perks.map(p => mc((p.minister ? "§b" : "§a") + p.name)).join(" · ")}</div>
    </div>`;
  }).join("");
}

async function loadElection() {
  let data = SNAPSHOT, live = false;
  // Our own server's cached copy first (it also means Discord settings exist), then Hypixel directly.
  for (const url of ["api/election", "https://api.hypixel.net/v2/resources/skyblock/election"]) {
    try {
      const j = await (await fetch(url)).json();
      if (j.success) { data = j; live = true; document.getElementById("settingsLink").hidden = url !== "api/election"; break; }
    } catch {}
  }
  renderElection(data, live);
  renderLegend(); renderMonth(); renderClock();
}

renderLegend(); renderMonth(); renderClock();
loadElection();
setInterval(renderClock, 1000);
setInterval(loadElection, 5 * 60000);
</script>
